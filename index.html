<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>Quét tem nhãn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--denim:#1d3557;--ink:#14213d;--amber:#ffb703;--ok:#2fbf71;--err:#e5383b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden}
  #top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(20,33,61,.94);align-items:center}
  #reload{background:#fff;color:var(--ink);padding:5px 12px;font-size:16px;border-radius:20px}
  [hidden]{display:none!important}
  .field{flex:1 1 28%;min-width:0;background:#fff;color:var(--ink);text-align:left;padding:6px 12px;border-radius:10px;font-weight:400;display:block}
  .field small{display:block;font-size:11px;color:#5b6577;font-weight:600}
  .field b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sheet{position:fixed;inset:0;z-index:20;background:#f4f5f7;color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  #sHead{display:flex;align-items:center;gap:8px;padding:10px;background:var(--denim);color:#fff}
  #sTitle{flex:1;font-weight:800;font-size:18px}
  #sHead button{background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;font-size:18px}
  #sCrumb{padding:8px 14px;font-size:14px;font-weight:600;color:#33415c}
  #sQ{margin:0 10px 8px;font:inherit;font-size:16px;padding:12px;border:2px solid #cfd6e2;border-radius:10px;width:calc(100% - 20px)}
  #sList{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:58px;text-align:left;background:#fff;color:var(--ink);border-radius:0;border-bottom:1px solid #e3e7ef;padding:14px;font-size:18px;font-weight:600}
  .row small{font-weight:400;font-size:13px;color:#5b6577;white-space:nowrap}
  .row.on{background:#fff3cd}.row .t{word-break:break-all}
  .pill{background:var(--amber);color:var(--ink);font-weight:800;border-radius:20px;padding:5px 12px;font-size:14px;white-space:nowrap}
  #pend{background:#fff}
  #err{position:absolute;top:128px;left:10px;right:10px;z-index:4;background:var(--err);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:none}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #guide{position:absolute;left:5%;right:5%;top:26%;height:34%;border:3px solid var(--amber);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
  #guide.ok{border-color:var(--ok)}#guide.bad{border-color:var(--err)}
  #plus{position:absolute;left:0;right:0;top:33%;text-align:center;z-index:4;font-size:88px;font-weight:800;color:var(--ok);text-shadow:0 2px 14px rgba(0,0,0,.8);pointer-events:none;opacity:0}
  #plus.go{animation:pop .8s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
  @keyframes fade{0%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#plus.go{animation:fade .8s}}
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.88) 30%);display:grid;gap:8px}
  #bottom.warn{background:linear-gradient(transparent,rgba(120,0,0,.92) 30%)}
  #first{font-size:26px;font-weight:800;line-height:1.15;word-break:break-all}
  #first.warn{color:#ff6b6b}
  #txt{font-size:13px;opacity:.9;white-space:pre-wrap;max-height:5.6em;overflow:hidden}
  #meta{font-size:12px;opacity:.7;min-height:16px}
  #row{display:flex;gap:10px}
  button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px;cursor:pointer}
  #shot{flex:1;background:var(--amber);color:var(--ink);font-size:20px;padding:18px}
  #undo{background:rgba(255,255,255,.18);color:#fff}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="top">
  <button id="fMua" class="field" aria-label="Chọn mùa sản xuất"><small>Mùa SX</small><b id="vMua">—</b></button>
  <button id="fOrder" class="field" aria-label="Chọn đơn hàng"><small>Đơn hàng</small><b id="vOrder">—</b></button>
  <button id="fGiao" class="field" aria-label="Chọn đợt giao hàng"><small>Giao hàng</small><b id="vGiao">—</b></button>
  <button id="reload" aria-label="Làm mới danh sách đơn hàng">↻</button><span class="pill" id="cnt">Quét 0</span><span class="pill" id="pend">Chờ 0</span>
</div>
<div id="err" role="alert"></div>
<video id="cam" playsinline muted autoplay></video>
<div id="guide"></div>
<div id="plus" aria-hidden="true">+1</div>
<div id="bottom">
  <div><div id="first">Đang khởi động…</div><div id="txt"></div><div id="meta"></div></div>
  <div id="row"><button id="shot">QUÉT</button><button id="undo">Hủy</button></div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div id="sHead"><button id="sBack" aria-label="Quay lại chọn đơn hàng">←</button><div id="sTitle">Chọn đơn hàng</div><button id="sClose" aria-label="Đóng">✕</button></div>
  <div id="sCrumb"></div>
  <input id="sQ" type="search" placeholder="Tìm tên đơn hàng" autocomplete="off">
  <div id="sList"></div>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
// ===== CẤU HÌNH =====
const API_URL = 'https://script.google.com/macros/s/AKfycbw424lv1NVJ1TRapsOFQOp5IcdtWrjCTQaWAGAibe3EHIEB-dUthyGtFDUcp4wFc91Y/exec';
const KEY = '12345678';   // phải giống KEY trong Code.gs
const MODE = 'hybrid';             // 'hybrid' | 'local' | 'server' (server = chỉ dùng OCR Google)
const LANG = 'vie';
const MIN_CONF = 55, LOW_CONF = 75, FLUSH_MS = 4000, FLUSH_N = 40, MAX_W = 1600;
// =====================
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
let worker = null, localOK = false, audio = null;
let jobs = [], queue = [], scanned = 0, sending = false, stream = null;
let orders = [], cur = { mua: '', don: '', giao: '' };
try { queue = JSON.parse(localStorage.getItem('q') || '[]'); } catch (e) {}

const api = (action, p) => fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  body: JSON.stringify(Object.assign({ key: KEY, action: action }, p || {})) })
  .then(r => r.text()).then(t => {
    let j; try { j = JSON.parse(t); } catch (e) { throw new Error('API trả về trang web thay vì dữ liệu. Kiểm tra API_URL (phải là link /exec), quyền truy cập "Bất kỳ ai" và đã triển khai Phiên bản mới.'); }
    if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ'); return j; });
const persist = () => { try { localStorage.setItem('q', JSON.stringify(queue)); } catch (e) {} };
const ui = () => { $('cnt').textContent = 'Quét ' + scanned; $('pend').textContent = 'Chờ ' + (queue.length + jobs.length); };
const showErr = m => { $('err').textContent = m || ''; $('err').style.display = m ? 'block' : 'none'; };
const flash = c => { const g = $('guide'); g.className = c; setTimeout(() => g.className = '', 350); };
const plus = () => { const p = $('plus'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); };

// Âm thanh: bíp 2 nốt khi đọc được, 1 nốt trầm khi lỗi
function getAudio(){ if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (audio && audio.state === 'suspended') audio.resume(); return audio; }
document.addEventListener('pointerdown', getAudio, { passive: true });
function tone(f, at, d){ const a = getAudio(); if (!a) return; const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = f; g.gain.value = .18; o.connect(g); g.connect(a.destination); o.start(a.currentTime + at); o.stop(a.currentTime + at + d); }
function beep(ok){ try { if (ok) { tone(880, 0, .07); tone(1320, .08, .09); } else tone(220, 0, .22); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 60, 80]); }
// Báo động khi tem chưa đọc đúng: 3 tiếng trầm + rung dài
function alarm(){ try { tone(220, 0, .18); tone(220, .25, .18); tone(220, .5, .18); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); }

const tidy = t => String(t).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '');
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// ===== 1) Lướt chọn Mùa SX -> Đơn hàng -> Giao hàng =====
let ordersT = 0, byMua = new Map(), lvl = 1, sp = { mua: '', don: '' };
const MAX_ROWS = 300, NOMUA = '(không có mùa)';
const updateFields = () => { $('vMua').textContent = cur.don ? (cur.mua || NOMUA) : '—'; $('vOrder').textContent = cur.don || '—'; $('vGiao').textContent = cur.giao || '—'; };
const validSel = c => !!(c && c.don && c.giao && byMua.has(c.mua) && byMua.get(c.mua).has(c.don) && byMua.get(c.mua).get(c.don).indexOf(c.giao) >= 0);
function loadOrders(fresh, first){
  return api('orders', { fresh: !!fresh }).then(j => {
    orders = j.orders; byMua = new Map(); ordersT = Date.now();
    orders.forEach(o => {
      if (!byMua.has(o.mua)) byMua.set(o.mua, new Map());
      const m = byMua.get(o.mua); if (!m.has(o.don)) m.set(o.don, []);
      const a = m.get(o.don); if (a.indexOf(o.giao) < 0) a.push(o.giao);
    });
    let want = cur;
    if (first) { try { want = JSON.parse(localStorage.getItem('cur') || 'null') || cur; } catch (e) {} }
    if (validSel(want)) cur = { mua: want.mua, don: want.don, giao: want.giao };
    else if (cur.don || cur.giao) { cur = { mua: '', don: '', giao: '' }; saveCur(); }
    updateFields();
    let nd = 0; byMua.forEach(m => nd += m.size);
    $('meta').textContent = 'Đã cập nhật ' + byMua.size + ' mùa · ' + nd + ' đơn · ' + orders.length + ' đợt giao';
    if (!cur.don) $('first').textContent = 'Chọn mùa SX, đơn hàng, giao hàng';
    if (!$('sheet').hidden) drawSheet(); else if (first && !cur.don) openSheet(1);
  }).catch(e => showErr('Không nối được Google Sheet: ' + e.message));
}
function openSheet(level){
  sp = { mua: cur.mua, don: cur.don };
  let l = level;
  if (l > 1 && !(cur.don && byMua.has(cur.mua) && byMua.get(cur.mua).has(cur.don))) l = 1;
  if (l === 1 && byMua.size === 1) { sp.mua = byMua.keys().next().value; l = 2; }   // chỉ có 1 mùa: bỏ qua bước chọn mùa
  lvl = l; $('sQ').value = ''; $('sheet').hidden = false; drawSheet();
}
function levelItems(){
  if (lvl === 1) return Array.from(byMua.keys()).map(m => ({ main: m || NOMUA, val: m, sub: byMua.get(m).size + ' đơn', on: m === cur.mua && !!cur.don }));
  const dm = byMua.get(sp.mua) || new Map();
  if (lvl === 2) return Array.from(dm.keys()).map(d => ({ main: d, val: d, sub: dm.get(d).length + ' đợt giao', on: sp.mua === cur.mua && d === cur.don }));
  return (dm.get(sp.don) || []).map(g => ({ main: g, val: g, sub: '', on: sp.mua === cur.mua && sp.don === cur.don && g === cur.giao }));
}
function drawSheet(){
  const list = $('sList'); list.innerHTML = '';
  $('sTitle').textContent = ['', 'Chọn mùa SX', 'Chọn đơn hàng', 'Chọn đợt giao hàng'][lvl];
  $('sBack').hidden = lvl === 1 || (lvl === 2 && byMua.size === 1);
  $('sCrumb').textContent = lvl === 1 ? 'Vuốt để chọn mùa sản xuất' : lvl === 2 ? 'Mùa SX: ' + (sp.mua || NOMUA) : 'Mùa SX: ' + (sp.mua || NOMUA) + '  ›  Đơn hàng: ' + sp.don;
  const items = levelItems();
  $('sQ').hidden = items.length <= 8;
  $('sQ').placeholder = ['', 'Tìm mùa SX', 'Tìm tên đơn hàng', 'Tìm đợt giao hàng'][lvl];
  const terms = norm($('sQ').value).split(/\s+/).filter(Boolean);
  const m = items.filter(it => terms.every(t => norm(it.main).indexOf(t) >= 0));
  m.slice(0, MAX_ROWS).forEach(it => {
    const b = document.createElement('button'), t = document.createElement('span');
    b.className = 'row' + (it.on ? ' on' : ''); t.className = 't'; t.textContent = (it.on ? '✓ ' : '') + it.main; b.appendChild(t);
    if (it.sub) { const sm = document.createElement('small'); sm.textContent = it.sub; b.appendChild(sm); }
    b.onclick = () => pick(it.val); list.appendChild(b);
  });
  const note = x => { const d = document.createElement('div'); d.style.cssText = 'padding:12px 14px;color:#555;font-size:14px'; d.textContent = x; list.appendChild(d); };
  if (m.length > MAX_ROWS) note('Còn ' + (m.length - MAX_ROWS) + ' mục nữa, gõ thêm để lọc.');
  if (!m.length) note(byMua.size ? 'Không thấy? Kiểm tra từ khóa hoặc đóng rồi bấm ↻ để cập nhật danh sách.' : 'Danh sách đang trống.');
  const on = list.querySelector('.on'); if (on && !$('sQ').value) on.scrollIntoView({ block: 'center' });
}
function goLevel(l){ lvl = l; $('sQ').value = ''; drawSheet(); $('sList').scrollTop = 0; }
function afterDon(){ const gl = byMua.get(sp.mua).get(sp.don); if (gl.length === 1) return choose(sp.mua, sp.don, gl[0]); goLevel(3); }
function pick(v){
  if (lvl === 1) { sp.mua = v; const dm = byMua.get(v); if (dm.size === 1) { sp.don = dm.keys().next().value; return afterDon(); } goLevel(2); }
  else if (lvl === 2) { sp.don = v; afterDon(); }
  else choose(sp.mua, sp.don, v);
}
function choose(m, d, g){ cur = { mua: m, don: d, giao: g }; $('sheet').hidden = true; updateFields(); saveCur(); $('first').textContent = 'Đưa tem vào khung'; }
function saveCur(){ try { localStorage.setItem('cur', JSON.stringify(cur)); } catch (e) {} }
$('fMua').onclick = () => openSheet(1);
$('fOrder').onclick = () => openSheet(2);
$('fGiao').onclick = () => openSheet(3);
$('sQ').oninput = drawSheet;
$('sBack').onclick = () => goLevel(lvl - 1);
$('sClose').onclick = () => { $('sheet').hidden = true; };
$('reload').onclick = () => { $('meta').textContent = 'Đang cập nhật danh sách…'; loadOrders(true); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ordersT > 60000) loadOrders(true); });
const ready_ = () => !!(cur.giao && cur.don);
loadOrders(false, true);

// ===== 2) Camera mở ngay =====
async function startCam(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $('cam').srcObject = stream; await $('cam').play();
    try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  } catch (e) { showErr('Camera bị chặn (' + (e.name || 'lỗi') + '). Cho phép camera cho trang này rồi tải lại. Tạm thời dùng nút QUÉT để mở camera điện thoại.'); }
}

// ===== 3) Bộ đọc chữ =====
async function startOcr(){
  if (MODE !== 'server') {
    try {
      $('first').textContent = 'Đang nạp bộ đọc chữ…';
      worker = await Tesseract.createWorker(LANG, 1, { logger: () => {} });
      await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      localOK = true;
    } catch (e) { showErr('Không nạp được bộ đọc trên máy, dùng OCR Google (chậm hơn).'); }
  }
  $('first').textContent = ready_() ? 'Đưa tem vào khung' : 'Chọn mùa SX, đơn hàng, giao hàng';
}
const CROP = { x: .05, y: .26, w: .9, h: .34 };   // khớp khung vàng
function grab(src){
  const v = src || $('cam'), W = v.videoWidth || v.naturalWidth, H = v.videoHeight || v.naturalHeight;
  if (!W) return null;
  const c0 = src ? { x: 0, y: 0, w: W, h: H } : { x: W * CROP.x, y: H * CROP.y, w: W * CROP.w, h: H * CROP.h };
  const k = Math.min(1, MAX_W / c0.w), c = document.createElement('canvas');
  c.width = Math.round(c0.w * k); c.height = Math.round(c0.h * k);
  const x = c.getContext('2d'); x.filter = 'grayscale(1)';
  x.drawImage(v, c0.x, c0.y, c0.w, c0.h, 0, 0, c.width, c.height);
  return c;
}

// Dựng dòng theo TỌA ĐỘ từng từ (cùng hàng ngang = cùng dòng), không dùng cách chia dòng tự động của OCR
function linesFromWords(data){
  let words = data.words;
  if (!words && data.blocks) { words = []; try { data.blocks.forEach(b => b.paragraphs.forEach(p => p.lines.forEach(l => l.words.forEach(w => words.push(w))))); } catch (e) {} }
  words = (words || []).filter(w => w.text && w.text.trim() && w.bbox);
  if (!words.length) return null;
  const hs = words.map(w => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b), mh = hs[hs.length >> 1] || 10;
  const items = words.map(w => ({ w: w, cy: (w.bbox.y0 + w.bbox.y1) / 2 })).sort((a, b) => a.cy - b.cy), rows = [];
  items.forEach(it => {
    const r = rows[rows.length - 1];
    if (r && Math.abs(it.cy - r.cy) <= mh * 0.6) { r.items.push(it); r.cy = r.items.reduce((t, x) => t + x.cy, 0) / r.items.length; }
    else rows.push({ cy: it.cy, items: [it] });
  });
  rows.forEach(r => r.items.sort((a, b) => a.w.bbox.x0 - b.w.bbox.x0));
  return rows;
}
async function readLocal(cv){
  const { data } = await worker.recognize(cv, {}, { text: true, blocks: true });
  const rows = linesFromWords(data);
  if (!rows) return { text: tidy(data.text), conf: Math.round(data.confidence) };
  const text = rows.map(r => r.items.map(i => i.w.text.trim()).join(' ')).join('\n');
  return { text: tidy(text), conf: Math.round(data.confidence) };
}
const serverOcr = cv => api('ocr', { image: cv.toDataURL('image/jpeg', .85).split(',')[1] }).then(j => tidy(j.text));

// ===== 4) Kiểm tra cỡ tem (cảnh báo, KHÔNG nhận tem nếu dòng đầu không hợp lệ) =====
// Quy tắc: dòng đầu của tem phải BẮT ĐẦU bằng 1 hoặc 2 chữ số (hoặc đúng "000").
// Chỉ lấy phần số đầu dòng, bỏ qua mọi ký tự phía sau (x, /, ...). VD: "26x2" -> 26, "26/2" -> 26.
// Không hợp lệ: bắt đầu bằng chữ, ký tự lạ, hoặc số có 3 chữ số trở lên (trừ 000).
function parseSize(text){
  const first = String(text).split('\n').map(l => l.trim()).filter(Boolean)[0] || '';
  const m = /^(\d+)/.exec(first);
  const d = m ? m[1] : '';
  const ok = d.length >= 1 && (d.length <= 2 || d === '000');
  return { first: first, n: ok ? d : '' };
}
let warned = false;
function hideWarn(){
  warned = false;
  $('first').classList.remove('warn'); $('bottom').classList.remove('warn');
  if ($('err').dataset.w) { showErr(''); delete $('err').dataset.w; }
}
function fail(text, sz){
  flash('bad'); alarm(); warned = true;
  const msg = sz.first ? '⚠ TEM KHÔNG HỢP LỆ – QUÉT LẠI' : '⚠ CHƯA ĐỌC ĐƯỢC TEM – QUÉT LẠI';
  $('first').textContent = msg; $('first').classList.add('warn'); $('bottom').classList.add('warn');
  $('txt').textContent = text || '';
  $('meta').textContent = (sz.first ? 'Dòng đầu đọc được: "' + sz.first + '" · ' : '') + 'Tem này CHƯA được lưu';
  showErr(msg); $('err').dataset.w = '1';
  return false;
}

// ===== 5) Quét tay (bấm QUÉT hoặc chạm vào camera) =====
function tap(){
  if (!$('sheet').hidden) return;
  if (!ready_()) { $('first').textContent = 'Chọn mùa SX, đơn hàng, giao hàng trước'; return; }
  if (!stream) return $('file').click();
  const cv = grab(); if (!cv) return;
  jobs.push({ cv: cv, g: cur.giao, d: cur.don }); ui(); flash('ok');
  if (navigator.vibrate) navigator.vibrate(20);
}
$('cam').onclick = $('shot').onclick = tap;
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !ready_()) return;
  const g = cur.giao, d = cur.don, im = new Image(); im.onload = () => { jobs.push({ cv: grab(im), g: g, d: d }); ui(); }; im.src = URL.createObjectURL(f); };

async function scan(job){
  const t0 = performance.now(), cv = job.cv;
  try {
    let text = '', conf = 0, via = 'máy';
    if (localOK && MODE !== 'server') { const res = await readLocal(cv); text = res.text; conf = res.conf; }
    let sz = parseSize(text);
    const bad = s => !s || !s.n;
    // Chuyển sang OCR Google khi độ tin cậy thấp HOẶC dòng đầu chưa hợp lệ
    if (MODE !== 'local' && (conf < LOW_CONF || bad(sz))) {
      $('first').textContent = 'Đang đọc chính xác…';
      const prev = { text: text, conf: conf, sz: sz };
      try {
        text = await serverOcr(cv); conf = 100; via = 'Google'; sz = parseSize(text);
        if (bad(sz) && !bad(prev.sz)) { text = prev.text; conf = prev.conf; sz = prev.sz; via = 'máy'; }
      } catch (e) { showErr('OCR Google lỗi: ' + e.message); }
    }
    if (bad(sz)) return fail(text, sz);
    hideWarn();
    const item = { t: Date.now(), giao: job.g, don: job.d, text: text, size: sz.n };
    if (conf < LOW_CONF) item.image = cv.toDataURL('image/jpeg', .6).split(',')[1];
    queue.push(item); persist(); scanned++; ui(); flash('ok'); beep(true); plus();
    $('first').textContent = 'Cỡ ' + sz.n; $('txt').textContent = text;
    $('meta').textContent = job.d + ' · ' + job.g + ' · ' + via + ' ' + Math.round(performance.now() - t0) + ' ms';
    if (queue.length >= FLUSH_N) flush();
    return true;
  } catch (e) { $('first').textContent = 'Lỗi đọc, quét lại'; showErr(String(e.message || e)); return false; }
}

// Xử lý lần lượt các ảnh đã chụp
async function loop(){
  while (true) {
    if (jobs.length) { await scan(jobs.shift()); ui(); }
    else await sleep(60);
  }
}
$('undo').onclick = () => {
  if (warned) { hideWarn(); $('first').textContent = 'Đã bỏ cảnh báo, quét lại'; $('txt').textContent = ''; $('meta').textContent = ''; return; }
  if (queue.length) { queue.pop(); persist(); scanned = Math.max(0, scanned - 1); ui(); $('first').textContent = 'Đã hủy tem vừa quét'; $('txt').textContent = ''; $('meta').textContent = ''; }
  else $('first').textContent = 'Tem đó đã gửi lên sheet';
};

// ===== 6) Gửi nền theo lô =====
function flush(){
  if (sending || !queue.length) return;
  sending = true; const batch = queue.splice(0, 60); persist();
  api('save', { items: batch }).then(() => { sending = false; ui(); if (!$('err').dataset.w) showErr(''); })
    .catch(e => { sending = false; queue = batch.concat(queue); persist(); ui(); showErr('Chưa ghi được vào Sheet: ' + e.message + ' (sẽ tự gửi lại)'); });
}
setInterval(flush, FLUSH_MS);
window.addEventListener('beforeunload', e => { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });
if (API_URL.indexOf('http') !== 0) showErr('Chưa dán link /exec của Apps Script vào API_URL trong Index.html');
ui(); startCam(); startOcr().then(loop);
</script>
